<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Tutor — Positional Analysis & Tactics</title>
<style>
  :root {
    --bg: #1e293b; --bg2: #0f172a; --panel: #334155; --panel2: #475569;
    --ink: #f1f5f9; --muted: #94a3b8; --accent: #f59e0b; --accent2: #fbbf24;
    --good: #34d399; --bad: #f87171; --sq-light: #e8d0a9; --sq-dark: #9c6b3c;
    --sel: rgba(245,158,11,.55); --last: rgba(245,158,11,.35); --check: rgba(248,113,113,.6);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--bg); border-bottom: 1px solid var(--panel);
    padding: .6rem 1.2rem; display: flex; align-items: center; gap: 1.2rem; }
  header h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.3rem;
    margin: 0; color: var(--accent2); font-weight: 600; }
  header h1 span { color: var(--muted); font-size: .85rem; font-family: sans-serif; font-weight: 400; }
  nav { display: flex; gap: .4rem; }
  nav button { background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: .45rem .9rem; border-radius: .4rem; cursor: pointer; font-size: .92rem; }
  nav button.active { background: var(--panel); color: var(--ink); border-color: var(--panel2); }
  nav button:hover { color: var(--ink); }
  main { display: flex; gap: 1.2rem; padding: 1.2rem; max-width: 1200px; margin: 0 auto;
    align-items: flex-start; }
  #board-wrap { position: relative; }
  #board { display: grid; grid-template-columns: repeat(8, 64px); grid-template-rows: repeat(8, 64px);
    border: 3px solid var(--panel); border-radius: 6px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); position: relative; user-select: none; }
  .sq { display: flex; align-items: center; justify-content: center;
    font-size: 44px; cursor: pointer; position: relative; }
  .sq.light { background: var(--sq-light); } .sq.dark { background: var(--sq-dark); }
  .sq .pc { pointer-events: none; line-height: 1; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .sq .pc.w { color: #fff; } .sq .pc.b { color: #1a1a1a; }
  .sq.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
  .sq.last { background-blend-mode: multiply; }
  .sq.last.light { background-color: #f0c96a; } .sq.last.dark { background-color: #c08a3e; }
  .sq.check.light { background-color: #fca5a5; } .sq.check.dark { background-color: #dc6a5a; }
  .sq .dot { position: absolute; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(20,40,20,.35); pointer-events: none; }
  .sq .cap { position: absolute; inset: 4px; border: 4px solid rgba(20,40,20,.35);
    border-radius: 50%; pointer-events: none; }
  .coord { position: absolute; font-size: 11px; color: rgba(0,0,0,.55); pointer-events: none; }
  .coord.rank { left: 3px; top: 2px; } .coord.file { right: 4px; bottom: 1px; }
  #arrow-svg { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  #panel { flex: 1; min-width: 320px; max-width: 460px; background: var(--bg);
    border: 1px solid var(--panel); border-radius: 8px; padding: 1rem 1.2rem; }
  #panel h2 { font-family: Georgia, serif; margin: 0 0 .6rem; font-size: 1.15rem; color: var(--accent2); }
  #panel h3 { margin: .9rem 0 .4rem; font-size: .95rem; color: var(--ink); }
  .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
  button.btn { background: var(--panel2); color: var(--ink); border: 1px solid #64748b;
    padding: .45rem .8rem; border-radius: .4rem; cursor: pointer; font-size: .88rem; }
  button.btn:hover { background: #64748b; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; font-weight: 600; }
  button.btn.primary:hover { background: var(--accent2); }
  button.btn:disabled { opacity: .45; cursor: default; }
  select, input[type=text] { background: var(--bg2); color: var(--ink); border: 1px solid var(--panel2);
    border-radius: .4rem; padding: .4rem .6rem; font-size: .88rem; }
  #eval-line { font-size: 1.05rem; margin: .5rem 0; }
  #eval-line b { color: var(--accent2); }
  #breakdown { list-style: none; padding: 0; margin: .5rem 0; max-height: 260px; overflow-y: auto; }
  #breakdown li { padding: .35rem .5rem; margin: .25rem 0; background: var(--bg2);
    border-left: 3px solid var(--accent); border-radius: 0 .3rem .3rem 0; font-size: .88rem; }
  #breakdown li.neg { border-left-color: var(--bad); }
  #breakdown li.pos { border-left-color: var(--good); }
  #moves { font-size: .9rem; line-height: 1.7; max-height: 120px; overflow-y: auto;
    background: var(--bg2); padding: .5rem .7rem; border-radius: .4rem; }
  #moves .mn { color: var(--muted); margin-right: .3rem; }
  #fen-in { width: 100%; font-family: monospace; font-size: .78rem; }
  .stat { display: flex; gap: 1.2rem; margin: .5rem 0; font-size: .92rem; }
  .stat b { color: var(--accent2); font-size: 1.1rem; }
  #puzzle-feedback { min-height: 2.2rem; font-size: .95rem; margin: .4rem 0; }
  #puzzle-feedback.good { color: var(--good); } #puzzle-feedback.bad { color: var(--bad); }
  .lesson-card { background: var(--bg2); border-radius: .5rem; padding: .8rem 1rem; margin: .6rem 0; }
  .lesson-card p { margin: .4rem 0; line-height: 1.55; font-size: .93rem; }
  .lesson-list button { display: block; width: 100%; text-align: left; margin: .3rem 0; }
  .cmv { cursor: pointer; padding: .05rem .3rem; border-radius: .25rem; }
  .cmv:hover { background: var(--panel2); }
  .cmv.cur { background: var(--accent); color: #1a1a1a; font-weight: 600; }
  #classic-moves { font-size: .9rem; line-height: 1.8; max-height: 260px; overflow-y: auto;
    background: var(--bg2); padding: .5rem .7rem; border-radius: .4rem; }
  #classic-moves .mn { color: var(--muted); margin-right: .3rem; }
  .kbd { background: var(--panel2); padding: .1rem .4rem; border-radius: .25rem; font-size: .8rem; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem; }
  @media (max-width: 900px) { main { flex-direction: column; } #board { grid-template-columns: repeat(8, 44px); grid-template-rows: repeat(8, 44px); } .sq { font-size: 32px; } }
</style>
</head>
<body>
<header>
  <h1>♞ Chess Tutor <span>positional analysis &amp; tactics</span></h1>
  <nav>
    <button data-mode="analyze" class="active">Analyze</button>
    <button data-mode="tactics">Tactics</button>
    <button data-mode="lessons">Lessons</button>
  </nav>
</header>
<main>
  <div id="board-wrap">
    <div id="board"></div>
    <svg id="arrow-svg"></svg>
    <div class="row" style="margin-top:.6rem">
      <button class="btn" id="flip-btn">Flip (F)</button>
      <span style="color:var(--muted);font-size:.82rem"><span class="kbd">←</span><span class="kbd">→</span> moves · <span class="kbd">F</span> flip</span>
    </div>
  </div>
  <div id="panel"></div>
</main>
<footer>Club-strength engine, written from scratch — no stockfish. Depth 1–4.</footer>

<script type="module">
import { Board, WHITE, BLACK, moveToUci, sqName, START_FEN, PIECE_LETTER } from '/src/engine.js';
import { analyze, evaluate, formatScore, MATE_SCORE } from '/src/search.js';
import { PUZZLES } from '/src/puzzles.js';
import { LESSONS } from '/src/lessons.js';
import { CLASSICS } from '/src/classics.js';

const GLYPHS = { k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟' };
const $ = s => document.querySelector(s);
const boardEl = $('#board'), panelEl = $('#panel'), arrowSvg = $('#arrow-svg');

// ---------- game state ----------
let board = Board.fromFEN(START_FEN);
let flipped = false, selected = -1, legalCache = [];
let moveHistory = []; // {uci, san}
let lastMove = null, analyzing = false, engineDepth = 3;
let vsEngine = false, engineThinking = false;
let mode = 'analyze';

// tactics state
let puzzleIdx = 0, streak = 0, score = 0, puzzleSolved = false, hintUsed = false;
try {
  const s = JSON.parse(localStorage.getItem('chess-tutor-tactics') || '{}');
  streak = s.streak || 0; score = s.score || 0; puzzleIdx = s.puzzleIdx || 0;
} catch {}
// lessons state
let lessonIdx = 0, cardIdx = 0, exerciseDone = false;
// classic games state (inside the Lessons tab)
let lessonView = 'positional'; // 'positional' | 'classics'
let classicIdx = 0, classicPly = 0, classicSans = [];

// ---------- board rendering ----------
function sqToXY(sq) {
  let f = sq & 7, r = sq >> 4;
  if (flipped) { f = 7 - f; r = 7 - r; }
  return { x: f, y: 7 - r };
}
function xyToSq(x, y) {
  let f = x, r = 7 - y;
  if (flipped) { f = 7 - f; r = 7 - r; }
  return r * 16 + f;
}
function render() {
  boardEl.innerHTML = '';
  const inChk = board.inCheck(board.turn);
  let kingSq = -1;
  if (inChk) {
    for (let s = 0; s < 128; s++) {
      if ((s & 0x88) === 0 && board.b[s] === (6 | board.turn)) { kingSq = s; break; }
    }
  }
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const sq = xyToSq(x, y);
    const d = document.createElement('div');
    const isLight = (x + y) % 2 === 0;
    d.className = 'sq ' + (isLight ? 'light' : 'dark');
    d.dataset.sq = sq;
    if (sq === selected) d.classList.add('sel');
    if (lastMove && (sq === lastMove.from || sq === lastMove.to)) d.classList.add('last');
    if (sq === kingSq) d.classList.add('check');
    const p = board.b[sq];
    if (p) {
      const span = document.createElement('span');
      span.className = 'pc ' + ((p & 24) === WHITE ? 'w' : 'b');
      span.textContent = GLYPHS[PIECE_LETTER[p & 7]];
      d.appendChild(span);
    }
    // legal dots
    for (const m of legalCache) {
      if (m.from === selected && m.to === sq) {
        const dot = document.createElement('div');
        dot.className = board.b[sq] ? 'cap' : 'dot';
        d.appendChild(dot);
      }
    }
    // coordinates
    if (x === 0) {
      const c = document.createElement('span');
      c.className = 'coord rank'; c.textContent = flipped ? (y + 1) : (8 - y);
      d.appendChild(c);
    }
    if (y === 7) {
      const c = document.createElement('span');
      c.className = 'coord file'; c.textContent = 'abcdefgh'[flipped ? 7 - x : x];
      d.appendChild(c);
    }
    boardEl.appendChild(d);
  }
  drawArrow();
}
function drawArrow() {
  arrowSvg.setAttribute('viewBox', '0 0 512 512');
  arrowSvg.innerHTML = '';
  if (!bestArrow) return;
  const a = sqToXY(bestArrow.from), b = sqToXY(bestArrow.to);
  const x1 = a.x * 64 + 32, y1 = a.y * 64 + 32, x2 = b.x * 64 + 32, y2 = b.y * 64 + 32;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const ex = x2 - Math.cos(ang) * 22, ey = y2 - Math.sin(ang) * 22;
  arrowSvg.innerHTML =
    `<line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" opacity="0.85"/>` +
    `<polygon points="${x2},${y2} ${x2 - 26*Math.cos(ang-0.42)},${y2 - 26*Math.sin(ang-0.42)} ${x2 - 26*Math.cos(ang+0.42)},${y2 - 26*Math.sin(ang+0.42)}" fill="#f59e0b" opacity="0.85"/>`;
}
let bestArrow = null;

// ---------- move input (click-to-move) ----------
boardEl.addEventListener('click', e => {
  const sqEl = e.target.closest('.sq'); if (!sqEl) return;
  const sq = +sqEl.dataset.sq;
  
  if (selected >= 0 && sq !== selected) { console.log('tryMove', selected, sq); tryMove(selected, sq); return; }
  const p = board.b[sq];
  if (p && (p & 24) === board.turn && canMoveNow()) select(sq); else select(-1);
});
function select(sq) {
  selected = sq;
  legalCache = sq >= 0 ? board.legalMoves() : [];
  render();
}
function canMoveNow() {
  if (engineThinking || analyzing) return false;
  if (mode === 'tactics') return !puzzleSolved;
  if (mode === 'lessons') return lessonView === 'positional' && exerciseActive();
  if (mode === 'analyze' && vsEngine && board.turn === BLACK) return false;
  return true;
}
function toSan(m) {
  // minimal SAN
  const piece = PIECE_LETTER[board.b[m.from] & 7];
  if (piece === 'k' && Math.abs(m.to - m.from) === 2) return m.to > m.from ? 'O-O' : 'O-O-O';
  let s = '';
  if (piece !== 'p') {
    s += piece.toUpperCase();
    // disambiguation
    const others = board.legalMoves().filter(x =>
      x.to === m.to && x.from !== m.from && (board.b[x.from] & 7) === (board.b[m.from] & 7));
    if (others.length) {
      const f1 = m.from & 7, f2 = others[0].from & 7;
      s += f1 !== f2 ? 'abcdefgh'[f1] : String((m.from >> 4) + 1);
    }
  } else if (m.captured) s += 'abcdefgh'[m.from & 7];
  if (m.captured) s += 'x';
  s += sqName(m.to);
  if (m.promo) s += '=' + PIECE_LETTER[m.promo].toUpperCase();
  const undo = board.make(m);
  if (board.inCheck(board.turn)) s += board.legalMoves().length === 0 ? '#' : '+';
  board.unmake(m, undo);
  return s;
}
function tryMove(from, to, promo) {
  const moves = board.legalMoves().filter(m => m.from === from && m.to === to);
  if (!moves.length) { select(-1); return false; }
  let m = moves.find(x => (x.promo || 0) === (promo || 0)) || moves.find(x => !x.promo) || moves[0];
  // auto-queen if multiple promos and none chosen
  if (moves.length > 1 && moves[0].promo && !promo) m = moves.find(x => x.promo === 5) || moves[0];
  const san = toSan(m);
  const undo = board.make(m);
  moveHistory.push({ uci: moveToUci(m), san });
  lastMove = { from, to };
  selected = -1; legalCache = [];
  afterMove(m);
  return true;
}
function afterMove(m) {
  render(); renderPanel();
  if (mode === 'tactics') onTacticsMove(m);
  else if (mode === 'lessons') onLessonMove(m);
  else if (mode === 'analyze' && vsEngine && board.turn === BLACK && !gameOver()) {
    engineThinking = true; renderPanel();
    setTimeout(() => {
      const r = analyze(fenOf(board), engineDepth, 4000);
      engineThinking = false;
      const bm = board.legalMoves().find(x => moveToUci(x) === r.bestUci);
      if (bm) { const san = toSan(bm); board.make(bm); moveHistory.push({ uci: r.bestUci, san }); lastMove = { from: bm.from, to: bm.to }; }
      render(); renderPanel();
    }, 60);
  }
}
function fenOf(b) {
  // full-ish FEN for the search (castling/ep omitted in tactics positions is fine,
  // but keep it correct for analyze mode)
  let rows = [];
  for (let r = 7; r >= 0; r--) {
    let row = '', empty = 0;
    for (let f = 0; f < 8; f++) {
      const p = b.b[r * 16 + f];
      if (!p) { empty++; continue; }
      if (empty) { row += empty; empty = 0; }
      const ch = PIECE_LETTER[p & 7];
      row += (p & 24) === WHITE ? ch.toUpperCase() : ch;
    }
    if (empty) row += empty;
    rows.push(row);
  }
  let cast = '';
  // reconstruct castling from king/rook positions (approximate: if on home squares)
  const W = WHITE, B = BLACK;
  if (b.b[4] === (6 | W)) {
    if (b.b[7] === (4 | W)) cast += 'K';
    if (b.b[0] === (4 | W)) cast += 'Q';
  }
  if (b.b[116] === (6 | B)) {
    if (b.b[119] === (4 | B)) cast += 'k';
    if (b.b[112] === (4 | B)) cast += 'q';
  }
  return `${rows.join('/')} ${b.turn === WHITE ? 'w' : 'b'} ${cast || '-'} - 0 1`;
}
function gameOver() {
  return board.legalMoves().length === 0;
}

// ---------- panel rendering ----------
function renderPanel() {
  if (mode === 'analyze') renderAnalyze();
  else if (mode === 'tactics') renderTactics();
  else renderLessons();
}

// ----- analyze -----
let analysisResult = null;
function renderAnalyze() {
  const over = gameOver();
  const chk = board.inCheck(board.turn);
  let status = '';
  if (over) status = chk ? (board.turn === WHITE ? 'Checkmate — Black wins' : 'Checkmate — White wins') : 'Stalemate — draw';
  else if (engineThinking) status = 'Engine thinking…';
  else if (analyzing) status = 'Analyzing…';
  else if (chk) status = 'Check!';

  let movesHtml = '';
  for (let i = 0; i < moveHistory.length; i += 2) {
    movesHtml += `<span class="mn">${i / 2 + 1}.</span> ${moveHistory[i].san}`;
    if (moveHistory[i + 1]) movesHtml += ` ${moveHistory[i + 1].san}`;
    movesHtml += ' ';
  }

  panelEl.innerHTML = `
    <h2>Positional Analysis</h2>
    <div class="row">
      <button class="btn primary" id="analyze-btn" ${analyzing || engineThinking ? 'disabled' : ''}>Analyze</button>
      <label style="font-size:.85rem;color:var(--muted)">Depth
        <select id="depth-sel">${[1,2,3,4].map(d => `<option ${d === engineDepth ? 'selected' : ''}>${d}</option>`).join('')}</select>
      </label>
    </div>
    <div id="eval-line">${analysisResult ? `<b>${formatScore(analysisResult.score, board.turn === WHITE ? BLACK : WHITE)}</b> · best: <b>${analysisResult.bestSan || ''}</b>` : (status || 'Press Analyze to explain this position.')}</div>
    <ul id="breakdown">${(analysisResult?.terms || []).map(t =>
      `<li class="${t.cp > 0 ? 'pos' : t.cp < 0 ? 'neg' : ''}">${t.label}</li>`).join('')}</ul>
    <h3>Moves</h3>
    <div id="moves">${movesHtml || '<span style="color:var(--muted)">No moves yet.</span>'}</div>
    <div class="row">
      <button class="btn" id="new-btn">New game vs engine</button>
      <button class="btn" id="takeback-btn">Take back</button>
    </div>
    <h3>Position (FEN)</h3>
    <div class="row"><input type="text" id="fen-in" value="${fenOf(board)}" spellcheck="false"></div>
    <div class="row">
      <button class="btn" id="fen-copy">Copy</button>
      <button class="btn" id="fen-load">Load</button>
    </div>`;
  $('#analyze-btn').onclick = runAnalysis;
  $('#depth-sel').onchange = e => engineDepth = +e.target.value;
  $('#new-btn').onclick = () => {
    board = Board.fromFEN(START_FEN); moveHistory = []; lastMove = null;
    analysisResult = null; bestArrow = null; vsEngine = true;
    selected = -1; render(); renderPanel();
  };
  $('#takeback-btn').onclick = () => {
    // take back one full round (or one ply if engine not involved)
    const n = vsEngine ? 2 : 1;
    // rebuild from scratch
    const keep = moveHistory.slice(0, Math.max(0, moveHistory.length - n));
    board = Board.fromFEN(START_FEN);
    moveHistory = []; lastMove = null;
    for (const mh of keep) {
      const m = board.legalMoves().find(x => moveToUci(x) === mh.uci);
      if (!m) break;
      board.make(m); moveHistory.push(mh); lastMove = { from: m.from, to: m.to };
    }
    analysisResult = null; bestArrow = null; render(); renderPanel();
  };
  $('#fen-copy').onclick = () => { $('#fen-in').select(); document.execCommand('copy'); };
  $('#fen-load').onclick = () => {
    try {
      board = Board.fromFEN($('#fen-in').value.trim());
      moveHistory = []; lastMove = null; analysisResult = null; bestArrow = null;
      vsEngine = false; selected = -1; render(); renderPanel();
    } catch { alert('Invalid FEN'); }
  };
}
function runAnalysis() {
  if (analyzing) return;
  analyzing = true; renderPanel();
  setTimeout(() => {
    const fen = fenOf(board);
    const r = analyze(fen, engineDepth, 8000);
    const ev = evaluate(board);
    const bm = board.legalMoves().find(m => moveToUci(m) === r.bestUci);
    analysisResult = { score: r.score, terms: ev.terms, bestSan: bm ? toSan(bm) : r.bestUci };
    bestArrow = bm ? { from: bm.from, to: bm.to } : null;
    analyzing = false;
    render(); renderPanel();
  }, 60);
}

// ----- tactics -----
function currentPuzzle() { return PUZZLES[puzzleIdx % PUZZLES.length]; }
function saveTactics() {
  try { localStorage.setItem('chess-tutor-tactics', JSON.stringify({ streak, score, puzzleIdx })); } catch {}
}
function loadPuzzle() {
  const p = currentPuzzle();
  board = Board.fromFEN(p.fen);
  moveHistory = []; lastMove = null; bestArrow = null;
  puzzleSolved = false; hintUsed = false; selected = -1;
  render();
}
function renderTactics() {
  const p = currentPuzzle();
  const toMove = p.fen.includes(' b ') ? 'Black' : 'White';
  panelEl.innerHTML = `
    <h2>Tactics Trainer</h2>
    <div class="stat"><span>Streak <b>${streak}</b></span><span>Score <b>${score}</b></span><span>Puzzle <b>${puzzleIdx + 1}</b></span></div>
    <p style="font-size:.93rem"><b>${toMove} to play and win.</b><br>
    <span style="color:var(--muted)">Find the winning move.</span></p>
    <div id="puzzle-feedback"></div>
    <div class="row">
      <button class="btn" id="hint-btn">Hint</button>
      <button class="btn" id="retry-btn">Retry</button>
      <button class="btn primary" id="next-btn">Next →</button>
    </div>
    <div id="hint-box" style="font-size:.88rem;color:var(--muted);margin-top:.4rem"></div>`;
  $('#hint-btn').onclick = () => {
    hintUsed = true;
    const target = sqName(parseInt(currentPuzzle().solution[0].slice(2, 4), 10) * 0 + uciToSq(currentPuzzle().solution[0].slice(2)));
    $('#hint-box').innerHTML = `Motif: <b>${p.motif}</b> · first move lands on <b>${sqName(uciToSq(p.solution[0].slice(2)))}</b>`;
    void target;
  };
  $('#retry-btn').onclick = loadPuzzle;
  $('#next-btn').onclick = () => { puzzleIdx++; saveTactics(); loadPuzzle(); renderPanel(); };
  if (puzzleSolved) {
    $('#puzzle-feedback').className = 'good';
    $('#puzzle-feedback').textContent = `Correct! ${p.title} — ${p.lesson}`;
  }
}
function uciToSq(s) {
  return ('abcdefgh'.indexOf(s[0])) + (parseInt(s[1]) - 1) * 16;
}
function onTacticsMove(m) {
  const p = currentPuzzle();
  const uci = moveToUci(m);
  const fb = $('#puzzle-feedback');
  if (uci === p.solution[0]) {
    puzzleSolved = true;
    streak++; score += hintUsed ? 5 : 10;
    saveTactics();
    if (fb) { fb.className = 'good'; fb.textContent = `Correct! ${p.title} — ${p.lesson}`; }
    // auto-advance after a beat
    setTimeout(() => { if (puzzleSolved) { puzzleIdx++; saveTactics(); loadPuzzle(); renderPanel(); } }, 1800);
  } else {
    streak = 0; saveTactics();
    if (fb) { fb.className = 'bad'; fb.textContent = 'Not it — try again (Retry resets the board).'; }
    renderTactics();
  }
  renderPanel();
}

// ----- lessons -----
function exerciseActive() {
  const l = LESSONS[lessonIdx];
  return cardIdx >= l.cards.length && !exerciseDone;
}
function renderLessons() {
  if (lessonView === 'classics') return renderClassics();
  const l = LESSONS[lessonIdx];
  if (cardIdx < l.cards.length) {
    const c = l.cards[cardIdx];
    panelEl.innerHTML = `
      <h2>Positional Lessons</h2>
      <div class="row" style="margin-bottom:.4rem">
        <button class="btn primary" id="view-positional">Positional lessons</button>
        <button class="btn" id="view-classics">Classic games · 100</button>
      </div>
      <div class="row lesson-list" style="margin-bottom:.4rem">
        <select id="lesson-sel">${LESSONS.map((x, i) => `<option value="${i}" ${i === lessonIdx ? 'selected' : ''}>${x.title}</option>`).join('')}</select>
      </div>
      <div class="lesson-card"><p><b>${l.title}</b> — card ${cardIdx + 1}/${l.cards.length}</p><p>${c.text}</p></div>
      <div class="row">
        <button class="btn" id="card-prev" ${cardIdx === 0 ? 'disabled' : ''}>← Back</button>
        <button class="btn primary" id="card-next">${cardIdx === l.cards.length - 1 ? 'Try the exercise →' : 'Next →'}</button>
      </div>
      <p style="color:var(--muted);font-size:.85rem">${l.intro}</p>`;
    $('#view-classics').onclick = () => { lessonView = 'classics'; loadClassic(); };
    $('#lesson-sel').onchange = e => { lessonIdx = +e.target.value; cardIdx = 0; exerciseDone = false; loadLessonCard(); };
    $('#card-prev').onclick = () => { cardIdx--; loadLessonCard(); };
    $('#card-next').onclick = () => { cardIdx++; loadLessonCard(); };
  } else {
    // exercise card
    const ex = l.exercise;
    panelEl.innerHTML = `
      <h2>Positional Lessons</h2>
      <div class="row" style="margin-bottom:.4rem">
        <button class="btn primary" id="view-positional">Positional lessons</button>
        <button class="btn" id="view-classics">Classic games · 100</button>
      </div>
      <div class="row"><select id="lesson-sel">${LESSONS.map((x, i) => `<option value="${i}" ${i === lessonIdx ? 'selected' : ''}>${x.title}</option>`).join('')}</select></div>
      <div class="lesson-card"><p><b>Your turn — ${l.title}</b></p><p>${ex.prompt}</p>
      <div id="ex-feedback" style="min-height:1.6rem;margin-top:.4rem"></div></div>
      <div class="row">
        <button class="btn" id="ex-hint">Hint</button>
        <button class="btn" id="ex-retry">Retry</button>
        <button class="btn" id="card-prev">← Back to cards</button>
      </div>`;
    $('#view-classics').onclick = () => { lessonView = 'classics'; loadClassic(); };
    $('#lesson-sel').onchange = e => { lessonIdx = +e.target.value; cardIdx = 0; exerciseDone = false; loadLessonCard(); };
    $('#ex-hint').onclick = () => { $('#ex-feedback').textContent = ex.hint; };
    $('#ex-retry').onclick = loadLessonCard;
    $('#card-prev').onclick = () => { cardIdx = l.cards.length - 1; loadLessonCard(); };
    if (exerciseDone) $('#ex-feedback').innerHTML = '<span style="color:var(--good)">Well played — exercise complete.</span>';
  }
}
function loadLessonCard() {
  const l = LESSONS[lessonIdx];
  const fen = cardIdx < l.cards.length ? l.cards[cardIdx].fen : l.exercise.fen;
  board = Board.fromFEN(fen);
  moveHistory = []; lastMove = null; bestArrow = null; selected = -1;
  exerciseDone = false;
  render(); renderLessons();
}
// ----- classic games (top 100) -----
function classicGame() { return CLASSICS[classicIdx]; }
function shortName(full) {
  // "Garry Kasparov" -> "Kasparov"; multi-name black like "Duke Karl / Count Isouard" kept whole
  if (full.includes('/')) return full;
  const parts = full.split(' ');
  return parts.length > 1 ? parts[parts.length - 1] : full;
}
function resultText(r) {
  return r === '1-0' ? 'White wins' : r === '0-1' ? 'Black wins' : r === '1/2-1/2' ? 'Draw' : r;
}
function loadClassic() {
  const g = classicGame();
  // SAN list, derived by replaying the UCI moves with the ENGINE's toSan
  // (the page's toSan reads the live board, not a replay board).
  const b = Board.fromFEN(START_FEN);
  classicSans = [];
  for (const uci of g.moves) {
    const m = b.legalMoves().find(x => moveToUci(x) === uci);
    if (!m) break;
    classicSans.push(b.toSan(m));
    b.make(m);
  }
  setClassicPly(0);
}
function setClassicPly(ply) {
  const g = classicGame();
  ply = Math.max(0, Math.min(g.moves.length, ply));
  classicPly = ply;
  board = Board.fromFEN(START_FEN);
  moveHistory = []; lastMove = null; bestArrow = null; selected = -1; legalCache = [];
  for (let i = 0; i < ply; i++) {
    const m = board.legalMoves().find(x => moveToUci(x) === g.moves[i]);
    if (!m) break;
    board.make(m);
    moveHistory.push({ uci: g.moves[i], san: classicSans[i] });
    lastMove = { from: m.from, to: m.to };
  }
  render(); renderLessons();
}
function renderClassics() {
  const g = classicGame();
  let movesHtml = '';
  for (let i = 0; i < classicSans.length; i += 2) {
    movesHtml += `<span class="mn">${i / 2 + 1}.</span> ` +
      `<span class="cmv${i + 1 === classicPly ? ' cur' : ''}" data-ply="${i + 1}">${classicSans[i]}</span>` +
      (classicSans[i + 1] ? ` <span class="cmv${i + 2 === classicPly ? ' cur' : ''}" data-ply="${i + 2}">${classicSans[i + 1]}</span>` : '') + ' ';
  }
  const done = classicPly >= g.moves.length;
  panelEl.innerHTML = `
    <h2>Classic Games</h2>
    <div class="row" style="margin-bottom:.4rem">
      <button class="btn" id="view-positional">Positional lessons</button>
      <button class="btn primary" id="view-classics">Classic games · 100</button>
    </div>
    <div class="row"><select id="classic-sel">${CLASSICS.map((x, i) =>
      `<option value="${i}" ${i === classicIdx ? 'selected' : ''}>${i + 1}. ${shortName(x.white)} vs ${shortName(x.black)} (${x.date.slice(0, 4)})</option>`).join('')}</select></div>
    <div class="lesson-card"><p><b>${g.white} vs ${g.black}</b></p>
    <p style="color:var(--muted)">${g.event}${g.site ? ` · ${g.site}` : ''} · ${g.date.slice(0, 4)}${g.eco ? ` · ${g.eco}` : ''}</p>
    <p>Move ${classicPly} of ${g.moves.length}${done ? ` — ${resultText(g.result)}` : ''}</p></div>
    <div id="classic-moves">${movesHtml}</div>
    <div class="row">
      <button class="btn" id="cl-start" ${classicPly === 0 ? 'disabled' : ''}>⏮ Start</button>
      <button class="btn" id="cl-prev" ${classicPly === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn primary" id="cl-next" ${done ? 'disabled' : ''}>Next →</button>
      <button class="btn" id="cl-end" ${done ? 'disabled' : ''}>End ⏭</button>
    </div>
    <p style="color:var(--muted);font-size:.85rem">Top 100 games of all time, from chessgames.com's World's Greatest Chess Games collection. Step with ← → or click any move.</p>`;
  $('#view-positional').onclick = () => { lessonView = 'positional'; cardIdx = 0; loadLessonCard(); };
  $('#classic-sel').onchange = e => { classicIdx = +e.target.value; loadClassic(); };
  $('#cl-start').onclick = () => setClassicPly(0);
  $('#cl-prev').onclick = () => setClassicPly(classicPly - 1);
  $('#cl-next').onclick = () => setClassicPly(classicPly + 1);
  $('#cl-end').onclick = () => setClassicPly(g.moves.length);
  document.querySelectorAll('#classic-moves .cmv').forEach(el => {
    el.onclick = () => setClassicPly(+el.dataset.ply);
  });
}
function onLessonMove(m) {
  const l = LESSONS[lessonIdx];
  if (cardIdx < l.cards.length) return;
  const ex = l.exercise;
  const uci = moveToUci(m);
  const fb = $('#ex-feedback');
  if (ex.solutions.includes(uci)) {
    exerciseDone = true;
    if (fb) fb.innerHTML = '<span style="color:var(--good)">Well played — exercise complete.</span>';
  } else {
    // engine check: is it at least reasonable?
    const r = analyze(fenOf(board), 2, 3000);
    if (fb) fb.innerHTML = '<span style="color:var(--bad)">Not quite — try again (Retry resets).</span>';
  }
  renderLessons();
}

// ---------- mode tabs & keyboard ----------
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    bestArrow = null; analysisResult = null; selected = -1;
    if (mode === 'tactics') loadPuzzle();
    else if (mode === 'lessons') {
      if (lessonView === 'classics') loadClassic();
      else { cardIdx = 0; loadLessonCard(); }
      return;
    }
    else { board = Board.fromFEN(START_FEN); moveHistory = []; lastMove = null; vsEngine = false; }
    render(); renderPanel();
  };
});
$('#flip-btn').onclick = () => { flipped = !flipped; render(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'f' || e.key === 'F') { flipped = !flipped; render(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    // step through a classic game in the Lessons tab
    if (mode === 'lessons' && lessonView === 'classics') {
      setClassicPly(classicPly + (e.key === 'ArrowRight' ? 1 : -1));
      return;
    }
    // step through analyze move history
    if (mode !== 'analyze' || !moveHistory.length) return;
    // simple: rebuild to a given ply via data attr
    let ply = parseInt(boardEl.dataset.ply || moveHistory.length, 10);
    ply += e.key === 'ArrowRight' ? 1 : -1;
    ply = Math.max(0, Math.min(moveHistory.length, ply));
    boardEl.dataset.ply = ply;
    board = Board.fromFEN(START_FEN);
    const keep = moveHistory.slice(0, ply);
    const saved = moveHistory; moveHistory = []; lastMove = null;
    for (const mh of keep) {
      const m = board.legalMoves().find(x => moveToUci(x) === mh.uci);
      if (!m) break;
      board.make(m); moveHistory.push(mh); lastMove = { from: m.from, to: m.to };
    }
    moveHistory = saved;
    render();
  }
});

render(); renderPanel();
</script>
</body>
</html>
